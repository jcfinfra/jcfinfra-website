<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">LAB-004 | Proxmox VE — Homelab Architecture</title>
  <desc id="diagram-desc">ThinkPad T14 running Windows 11 connects through the home LAN to an HP ProBook 4540s running Proxmox VE 9.2, pve-manager 9.2.25. Debian 13 VM 100 and isolated restore-test VM 101 run on the Proxmox host. An external 1 TB BitLocker-protected backup drive is physically connected to the ThinkPad, receiving encrypted host configuration and compressed VM backups from Proxmox over SCP.</desc>
