    <radialGradient id="background"><stop stop-color="#112442"/><stop offset=".62" stop-color="#0a152a"/><stop offset="1" stop-color="#070c1b"/></radialGradient>
    <linearGradient id="workstation" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20324a"/><stop offset="1" stop-color="#121d31"/></linearGradient>
    <linearGradient id="hypervisor" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#062a32"/><stop offset="1" stop-color="#091b2d"/></linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#143b68"/><stop offset="1" stop-color="#0b2344"/></linearGradient>
    <linearGradient id="secondary" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2a374c"/><stop offset="1" stop-color="#1c2435"/></linearGradient>
    <linearGradient id="storage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#303025"/><stop offset="1" stop-color="#171d27"/></linearGradient>
    <linearGradient id="lan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#083643"/><stop offset="1" stop-color="#0c2737"/></linearGradient>
